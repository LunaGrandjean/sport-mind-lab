[install]
saveTextLockfile = true

# 24h supply-chain guard: skip package versions published less than a day ago.
minimumReleaseAge = 86400

# Kept because vite.config.ts still uses this build helper.
# TanStack packages are excluded so the security patch can deploy immediately.
minimumReleaseAgeExcludes = [
  "@lovable.dev/vite-tanstack-config",
  "@tanstack/react-start",
  "@tanstack/router-plugin",
  "@tanstack/start-server-core",
]
