<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Test auditif – Séquence 12 sons</title>

<style>
body {
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    padding: 20px;
}

h1 {
    font-size: 22px;
}

label {
    display: block;
    margin: 8px 0;
    font-size: 16px;
}

select {
    font-size: 14px;
    margin-left: 10px;
}

table {
    margin-top: 15px;
}

td {
    padding: 5px 10px;
}

#status {
    margin-top: 20px;
    font-size: 18px;
}

#result {
    margin-top: 15px;
    font-size: 22px;
    font-weight: bold;
    color: #4caf50;
}
.sound-preview { display:flex; flex-wrap:wrap; gap:10px; margin:15px 0; }
.sound-preview button { padding:10px 16px; cursor:pointer; }
</style>
<link rel="stylesheet" href="./test-theme.css">
</head>

<body>

<h1>Test auditif – touche ESPACE</h1>
<p>Piano percussif · Flûte douce et aiguë · Trompette grave et cuivrée</p>
<div class="sound-preview" aria-label="Écouter les instruments avant l’exercice">
    <button type="button" onclick="previewSound('piano')">Écouter le piano</button>
    <button type="button" onclick="previewSound('flute')">Écouter la flûte</button>
    <button type="button" onclick="previewSound('trumpet')">Écouter la trompette</button>
</div>

<label>
    <input type="radio" name="mode" value="random" checked>
    Mode aléatoire (1 son)
</label>

<label>
    <input type="radio" name="mode" value="sequence">
    Mode séquence (12 sons / réponses X-N)
</label>

<hr>

<h2>Séquence (12 sons)</h2>

<table>
<script>
for (let i = 1; i <= 12; i++) {
    document.write(`
        <tr>
            <td>Son ${i}</td>
            <td>
                <select id="step${i}">
                    <option value="">— silence —</option>
                    <option value="piano">Piano</option>
                    <option value="flute">Flûte</option>
                    <option value="trumpet">Trompette</option>
                </select>
            </td>
        </tr>
    `);
}
</script>
</table>

<div id="status">ESPACE = lancer | X = bonne | N = mauvaise</div>
<div id="result"></div>

<script>
const AudioContext = window.AudioContext || window.webkitAudioContext;
const ctx = new AudioContext();

let isPlaying = false;
let currentStep = 0;
let goodAnswers = 0;
let answeredThisStep = false;

// ===== SYNTHÈSES =====
function instrumentTone(audioCtx, frequency, type, duration, volume, attack, hold = attack) {
    const now = audioCtx.currentTime;
    const oscillator = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    oscillator.type = type;
    oscillator.frequency.value = frequency;
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(volume, now + attack);
    if (hold > attack) gain.gain.setValueAtTime(volume, now + hold);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
    gain.gain.linearRampToValueAtTime(0, now + duration + 0.015);
    oscillator.connect(gain).connect(audioCtx.destination);
    oscillator.onended = () => { oscillator.disconnect(); gain.disconnect(); };
    oscillator.start(now);
    oscillator.stop(now + duration + 0.02);
}

function playPiano(audioCtx = ctx) {
    instrumentTone(audioCtx, 440, "triangle", 0.95, 0.32, 0.005);
    instrumentTone(audioCtx, 880, "sine", 0.42, 0.12, 0.003);
    instrumentTone(audioCtx, 1320, "sine", 0.22, 0.06, 0.002);
}

function playFlute(audioCtx = ctx) {
    instrumentTone(audioCtx, 784, "sine", 1.1, 0.28, 0.16, 0.55);
}

function playTrumpet(audioCtx = ctx) {
    instrumentTone(audioCtx, 196, "sawtooth", 0.7, 0.22, 0.035, 0.3);
}

function playSound(name, audioCtx = ctx) {
    if (name === "piano") playPiano(audioCtx);
    if (name === "flute") playFlute(audioCtx);
    if (name === "trumpet") playTrumpet(audioCtx);
}

async function previewSound(name) {
    if (isPlaying) return;
    if (ctx.state === "suspended") await ctx.resume();
    playSound(name);
}

// ===== MODE SÉQUENCE =====
async function playSequence() {
    isPlaying = true;
    document.querySelectorAll('.sound-preview button').forEach(button => button.disabled = true);
    currentStep = 0;
    goodAnswers = 0;
    document.getElementById("result").textContent = "";

    for (let i = 1; i <= 12; i++) {
        currentStep = i;
        answeredThisStep = false;

        const value = document.getElementById("step" + i).value;
        if (value) playSound(value);

        document.getElementById("status").textContent =
            `Son ${i}/12 — X = bonne | N = mauvaise`;

        await new Promise(r => setTimeout(r, 2000));
    }

    isPlaying = false;
    document.querySelectorAll('.sound-preview button').forEach(button => button.disabled = false);
    document.getElementById("status").textContent = "Séquence terminée";
    document.getElementById("result").textContent =
        `Bonnes réponses : ${goodAnswers} / 12`;
}

// ===== MODE ALÉATOIRE =====
function playRandom() {
    const list = ["piano", "flute", "trumpet"];
    playSound(list[Math.floor(Math.random() * list.length)]);
}

// ===== CLAVIER =====
document.addEventListener("keydown", async (e) => {
    if (ctx.state === "suspended") await ctx.resume();

    // ESPACE
    if (e.code === "Space") {
        e.preventDefault();
        if (isPlaying) return;
        const mode = document.querySelector('input[name="mode"]:checked').value;
        if (mode === "random") playRandom();
        if (mode === "sequence") playSequence();
    }

    // BONNE / MAUVAISE
    if (!isPlaying || answeredThisStep) return;

    if (e.key.toLowerCase() === "x") {
        goodAnswers++;
        answeredThisStep = true;
    }

    if (e.key.toLowerCase() === "n") {
        answeredThisStep = true;
    }
});
</script>

<script src="./test-shell.js"></script>
</body>
</html>
