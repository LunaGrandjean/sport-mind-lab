<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Test Neuro-Cognitif – Vitesse Motrice</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body {
    margin: 0;
    font-family: "Segoe UI", Arial, sans-serif;
    background: linear-gradient(120deg,#f0f2f5,#e6e9ef);
}
.card {
    max-width: 500px;
    margin: 80px auto;
    background: white;
    padding: 35px;
    border-radius: 12px;
    box-shadow: 0 15px 30px rgba(0,0,0,0.1);
}
h1,h2 {
    text-align: center;
}
label {
    display: block;
    margin-top: 15px;
}
input, select {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    border-radius: 6px;
    border: 1px solid #ccc;
}
button {
    margin-top: 25px;
    width: 100%;
    padding: 14px;
    font-size: 16px;
    border: none;
    border-radius: 8px;
    background: #2b6cb0;
    color: white;
    cursor: pointer;
}
button:hover {
    background: #2c5282;
}
#testScreen {
    display: none;
    position: fixed;
    inset: 0;
    background: white;
}
#timer {
    position: fixed;
    bottom: 30px;
    right: 40px;
    font-size: 48px;
    font-weight: bold;
}
.circle {
    position: absolute;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: rgba(0,0,0,0.2);
}
#results {
    display: none;
    max-width: 900px;
    margin: 40px auto;
    background: white;
    padding: 30px;
    border-radius: 10px;
}
.comparison {
    background:#f1f5f9;
    padding:15px;
    border-radius:8px;
    margin-top:20px;
}
.side-actions { display:flex; gap:12px; flex-wrap:wrap; }
.side-actions button { flex:1 1 180px; }
#testSide { position:fixed; top:24px; left:24px; color:#102a43; font-size:24px; font-weight:700; }
.history-columns { display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:20px; }
.history-scroll { max-height:320px; overflow:auto; }
.history-columns table { width:100%; border-collapse:collapse; font-size:14px; }
.history-columns th,.history-columns td { padding:8px 5px; text-align:left; border-bottom:1px solid #dce4ec; }
</style>
<link rel="stylesheet" href="./test-theme.css">
</head>

<body>

<div class="card" id="page1">
<h1>Test de Vitesse Motrice</h1>

<input id="nom" type="hidden" value="Session">
<input id="prenom" type="hidden" value="Sportif">
<input id="age" type="hidden" value="0">

<label for="temps">Durée du test (en secondes)</label>
<input id="temps" type="number" min="0.1" step="any" value="30" placeholder="30">
<p class="protocol-note">30 secondes par défaut. Le chronomètre démarre au premier appui sur Espace.</p>
<p>Seuls les essais de 30 secondes comptent pour la note et les records. Les autres durées sont enregistrées comme exercices.</p>

<div class="side-actions">
<button onclick="startTest('G')">Démarrer Gauche</button>
<button onclick="startTest('D')">Démarrer Droite</button>
</div>
<section id="menuHistory" aria-label="Historique CPS par côté"></section>
</div>

<div id="testScreen">
<div id="testSide"></div>
<div id="timer"></div>
</div>

<div id="results">
<h2>Compte rendu</h2>
<div id="summary"></div>
<div id="comparison"></div>
<canvas id="chart"></canvas>
<button onclick="downloadPDF()">Télécharger le PDF</button>
<div class="side-actions">
<button onclick="startTest('G')">Recommencer G</button>
<button onclick="startTest('D')">Recommencer D</button>
</div>
<button onclick="showMenu()">Modifier la durée / Retour au menu</button>
<section id="resultHistory" aria-label="Historique CPS par côté"></section>
</div>

<script>
let clicks = 0;
let duration, startTime;
let timeline = [];
let cpsTimeline = [];
let started = false;
let interval;
let lastCircle;
let side;
let resultChart;
let attemptId;
const athleteId = new URLSearchParams(window.location.search).get("athleteId");

function sideLabel(value) {
    return value === "G" ? "Gauche (G)" : "Droite (D)";
}

function historyKey() {
    const identity = athleteId || JSON.stringify([nom.value, prenom.value, age.value]);
    return "sport-mind-lab:cps:" + identity;
}

function readHistory(key = historyKey()) {
    try {
        const value = JSON.parse(localStorage.getItem(key) || "[]");
        return Array.isArray(value) ? value.filter(item => item && Number.isFinite(item.clicks) && Number.isFinite(Number(item.cps))) : [];
    } catch { return []; }
}

function renderHistory() {
    const history = readHistory();
    for (const container of [menuHistory, resultHistory]) {
        container.replaceChildren();
        const heading = document.createElement("h2");
        heading.textContent = "Historique de l’athlète";
        container.appendChild(heading);
        const columns = document.createElement("div");
        columns.className = "history-columns";
        for (const value of ["G", "D"]) {
            const section = document.createElement("section");
            const title = document.createElement("h3");
            title.textContent = sideLabel(value);
            section.appendChild(title);
            const entries = history.filter(item => item.side === value).reverse();
            if (!entries.length) {
                const empty = document.createElement("p");
                empty.textContent = "Aucun essai enregistré.";
                section.appendChild(empty);
            } else {
                const scroll = document.createElement("div");
                scroll.className = "history-scroll";
                const table = document.createElement("table");
                table.innerHTML = "<thead><tr><th>Date</th><th>Durée</th><th>Clics</th><th>CPS</th></tr></thead>";
                const tbody = document.createElement("tbody");
                for (const entry of entries) {
                    const row = tbody.insertRow();
                    for (const text of [new Date(entry.date).toLocaleString(), entry.duration + " s", entry.clicks, Number(entry.cps).toFixed(2)]) {
                        row.insertCell().textContent = text;
                    }
                }
                table.appendChild(tbody);
                scroll.appendChild(table);
                section.appendChild(scroll);
            }
            columns.appendChild(section);
        }
        container.appendChild(columns);
        const legacyCount = readHistory(`${nom.value}_${prenom.value}_${age.value}`).filter(item => !item.side).length;
        if (legacyCount) {
            const note = document.createElement("p");
            note.textContent = `${legacyCount} ancien(s) essai(s) conservé(s) sans côté renseigné ; exclus des comparaisons gauche/droite.`;
            container.appendChild(note);
        }
    }
}

function showMenu() {
    results.style.display = "none";
    page1.style.display = "block";
    renderHistory();
}

function startTest(selectedSide) {
    if (selectedSide !== "G" && selectedSide !== "D") return;
    if (temps.validity.badInput) { temps.reportValidity(); return; }
    if (temps.value === "") temps.value = "30";
    if (!temps.reportValidity()) return;
    duration = Number(temps.value);
    if (!Number.isFinite(duration) || duration <= 0) return;
    clearInterval(interval);
    lastCircle?.remove();
    lastCircle = null;
    resultChart?.destroy();
    resultChart = null;
    side = selectedSide;
    attemptId = crypto.randomUUID();
    clicks = 0;
    timeline = [];
    cpsTimeline = [];
    started = false;
    timer.textContent = duration + " s";
    testSide.textContent = "Côté " + sideLabel(side) + " · Espace pour commencer";
    page1.style.display = "none";
    results.style.display = "none";
    testScreen.style.display = "block";
    testScreen.requestFullscreen?.().catch(()=>{});
}

document.addEventListener("keydown", e => {
    if (testScreen.style.display !== "block") return;
    if (e.code !== "Space") return;
    e.preventDefault();
    if (e.repeat) return;
    if (started && (Date.now() - startTime) / 1000 >= duration) {
        updateTimer();
        return;
    }

    if (!started) {
        started = true;
        testSide.textContent = "Côté " + sideLabel(side);
        startTime = Date.now();
        interval = setInterval(updateTimer, 50);
    }

    clicks++;
    let t = (Date.now() - startTime) / 1000;
    timeline.push({t, c: clicks});
    cpsTimeline.push({t, cps: t > 0 ? clicks / t : 0});

    if (lastCircle) lastCircle.remove();
    let circle = document.createElement("div");
    circle.className = "circle";
    circle.style.left = Math.random()*window.innerWidth+"px";
    circle.style.top = Math.random()*window.innerHeight+"px";
    testScreen.appendChild(circle);
    lastCircle = circle;
});

function updateTimer() {
    let elapsed = (Date.now() - startTime) / 1000;
    let remaining = Math.max(0, (duration - elapsed).toFixed(1));
    timer.innerText = remaining + " s";
    if (elapsed >= duration) {
        clearInterval(interval);
        finish();
    }
}

function finish() {
    if (testScreen.style.display !== "block" || !started) return;
    clearInterval(interval);
    started = false;
    if (document.fullscreenElement) document.exitFullscreen?.().catch(()=>{});
    testScreen.style.display = "none";
    results.style.display = "block";

    let cps = (clicks / duration).toFixed(2);
    let tier = duration / 3;
    let first = timeline.filter(p=>p.t<=tier).length;
    let last = timeline.filter(p=>p.t>=2*tier).length;
    let fatigue = last-first;

    const history = readHistory();
    const date = new Date().toISOString();

    const comparableHistory = history.filter(item => item.side === side && item.duration === duration);
    let comparisonText = "<p><strong>Aucun test antérieur du même côté et de même durée pour cet athlète.</strong></p>";
    if (comparableHistory.length > 0) {
        let prev = comparableHistory[comparableHistory.length-1];
        comparisonText = `
        <div class="comparison">
        <strong>Comparaison ${sideLabel(side)} avec le test précédent de ${duration} s :</strong>
        <p>Δ Clics : ${clicks - prev.clicks}</p>
        <p>Δ CPS : ${(cps - prev.cps).toFixed(2)}</p>
        <p>Δ Fatigue : ${fatigue - prev.fatigue}</p>
        </div>`;
    }

    history.push({id: attemptId, date, side, duration, clicks, cps: Number(cps), fatigue});
    localStorage.setItem(historyKey(), JSON.stringify(history));
    renderHistory();

    summary.innerHTML = `
    <p>Date : ${new Date().toLocaleString()}</p>
    <p>Nom : ${nom.value}</p>
    <p>Prénom : ${prenom.value}</p>
    <p>Âge : ${age.value}</p>
    <p><strong>Côté : ${sideLabel(side)}</strong></p>
    <p>Temps : ${duration}s</p>
    <p>${duration === 30 ? "Test CPS de référence (30 s)" : "Exercice — sans note ni record"}</p>
    <p>Clics : ${clicks}</p>
    <p>CPS moyen : ${cps}</p>
    <p>Indice de fatigue : ${fatigue}</p>`;
    window.SportMindLabResult?.(clicks, `CPS ${sideLabel(side)} en ${duration} s`, {
        testId: "cps", athleteId, side, duration, attemptId,
    });

    comparison.innerHTML = comparisonText;

    if (window.Chart) resultChart = new Chart(chart, {
        type: "line",
        data: {
            labels: timeline.map(p=>p.t.toFixed(1)),
            datasets: [
                { label:"Clics cumulés", data:timeline.map(p=>p.c), borderColor:"blue", yAxisID:"y" },
                { label:"CPS", data:cpsTimeline.map(p=>p.cps), borderColor:"red", yAxisID:"y1" }
            ]
        },
        options: {
            scales: {
                y: { position:"left", title:{display:true,text:"Clics cumulés"} },
                y1: { position:"right", grid:{drawOnChartArea:false}, title:{display:true,text:"CPS"} }
            }
        }
    });
}

function downloadPDF() {
    const { jsPDF } = window.jspdf;
    let pdf = new jsPDF("p","mm","a4");

    let y = 15;

    let summaryLines = pdf.splitTextToSize(summary.innerText, 180);
    pdf.text(summaryLines, 10, y);
    y += summaryLines.length * 6 + 5;

    let comparisonLines = pdf.splitTextToSize(comparison.innerText, 180);
    pdf.text(comparisonLines, 10, y);
    y += comparisonLines.length * 6 + 8;

    let img = chart.toDataURL("image/png", 1.0);
    pdf.addImage(img, "PNG", 10, y, 180, 90);

    const safeName = `${nom.value}_${prenom.value}`.replace(/[^a-z0-9_-]+/gi, "_");
    pdf.save(`Resultat_vitesse_motrice_${side}_${duration}s_${safeName || "joueur"}.pdf`);
}
</script>

<script>
function hydrateAthleteFromSession(){
  const params = new URLSearchParams(window.location.search);
  const set = (id, fallback) => {
    const field = document.getElementById(id);
    if (field) field.value = params.get(id) || fallback;
  };
  set("nom", "Session");
  set("prenom", "Sportif");
  set("age", "0");
}
hydrateAthleteFromSession();
renderHistory();
</script>
<script src="./test-shell.js"></script>
</body>
</html>
