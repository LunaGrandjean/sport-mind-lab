<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Suivi Visuel Multi-Objets</title>

<style>
html,body{margin:0;height:100%;font-family:Segoe UI,Arial}
.page{display:none;height:100%;background:#b22222;color:white}
.page.active{display:flex;flex-direction:column;align-items:center;justify-content:center}

.formBox{
  background:rgba(0,0,0,0.35);
  padding:30px;border-radius:14px;
  display:flex;flex-direction:column;
  gap:22px;min-width:360px
}
.formBox input{font-size:18px;padding:14px;border-radius:8px;border:none}
button{font-size:18px;padding:12px 22px;border-radius:8px;border:none;cursor:pointer}

canvas{position:absolute;top:0;left:0}

/* Jauge temps */
#timeBar{position:absolute;right:0;top:0;width:50px;height:100%;background:#111}
#timeFill{position:absolute;bottom:0;width:100%;
background:linear-gradient(to top,#ff0000,#ffaa00,#00ff00)}

/* Réponses */
#bottomBar{
  position:absolute;bottom:0;width:100%;height:110px;
  background:rgba(0,0,0,0.55);
  display:flex;justify-content:center;align-items:center;gap:10px
}
.answerBtn{
  width:56px;height:56px;border-radius:50%;
  background:#eee;color:#222;font-weight:bold;
  display:flex;align-items:center;justify-content:center;
  font-size:18px
}

/* Feedback */
#cross{font-size:120px;color:#ff4444;display:none}
#goodAnswer{
  display:none;
  background:#0a3;
  padding:18px 30px;
  border-radius:14px;
  font-size:32px;
  font-weight:bold;
  box-shadow:0 0 20px rgba(0,0,0,.4)
}

/* Page 3 */
#reportBox{
  background:rgba(0,0,0,0.35);
  padding:30px;
  border-radius:14px;
  min-width:380px;
  font-size:18px;
  line-height:1.6
}
.actions{margin-top:30px;display:flex;flex-direction:column;gap:14px}
label{cursor:pointer}
</style>
</head>

<body>

<!-- PAGE 1 -->
<div class="page active" id="p1">
<h1>Test de suivi visuel</h1>
<div class="formBox">
<input id="nom" placeholder="Nom">
<input id="prenom" placeholder="Prénom">
<input id="age" type="number" placeholder="Âge">
<button onclick="startTest()">Démarrer</button>
</div>
</div>

<!-- PAGE 2 -->
<div class="page" id="p2">
<canvas id="cv"></canvas>
<div id="timeBar"><div id="timeFill"></div></div>
<div id="bottomBar"></div>
<div id="cross">✖</div>
<div id="goodAnswer"></div>
</div>

<!-- PAGE 3 -->
<div class="page" id="p3">
<h1>Compte rendu</h1>
<div id="reportBox"></div>

<div class="actions">
<label>
<input type="checkbox" id="pdfCheck" onchange="if(this.checked)exportPDF()">
 Export PDF
</label>

<button onclick="restart()">Recommencer</button>
<button onclick="menu()">Menu principal</button>
</div>
</div>

<script>
const cv=document.getElementById("cv"),ctx=cv.getContext("2d");
let level=1,errors=0,balls=[],startT,answered=false;
let reactionTimes=[];
const DURATION=10000;

/* ==== CALIBRATION VERROUILLÉE ==== */
const LEVEL_CONFIG = [
{ min:6,max:10,speed:0.45,var:0.00 },
{ min:6,max:10,speed:0.50,var:0.00 },
{ min:7,max:10,speed:0.52,var:0.02 },
{ min:7,max:10,speed:0.55,var:0.04 },
{ min:7,max:10,speed:0.58,var:0.06 },
{ min:7,max:10,speed:0.60,var:0.08 },
{ min:8,max:11,speed:0.60,var:0.10 },
{ min:8,max:11,speed:0.61,var:0.10 },
{ min:8,max:11,speed:0.61,var:0.10 },
{ min:8,max:11,speed:0.62,var:0.11 },
{ min:8,max:11,speed:0.62,var:0.12 },
{ min:8,max:11,speed:0.62,var:0.13 },
{ min:8,max:11,speed:0.63,var:0.14 },
{ min:8,max:12,speed:0.63,var:0.15 },
{ min:9,max:12,speed:0.63,var:0.16 },
{ min:9,max:12,speed:0.63,var:0.17 },
{ min:9,max:13,speed:0.62,var:0.19 },
{ min:10,max:14,speed:0.62,var:0.22 },
{ min:10,max:14,speed:0.63,var:0.26 },
{ min:10,max:14,speed:0.63,var:0.30 }
];

function resize(){cv.width=innerWidth-50;cv.height=innerHeight-110}
window.onresize=resize;

function show(p){
document.querySelectorAll(".page").forEach(e=>e.classList.remove("active"));
document.getElementById(p).classList.add("active");
}

function startTest(){
document.documentElement.requestFullscreen();
resize();
level=1;errors=0;reactionTimes=[];
show("p2");
startLevel();
}

function startLevel(){
answered=false;
cross.style.display=goodAnswer.style.display="none";
balls=[];
startT=Date.now();
createScale();

const c=LEVEL_CONFIG[level-1];
const n=Math.floor(Math.random()*(c.max-c.min+1))+c.min;

for(let i=0;i<n;i++){
balls.push({
x:Math.random()*cv.width,
y:Math.random()*cv.height,
a:Math.random()*6.28,
rot:Math.random()*6.28,
s:c.speed,v:c.var,r:26,next:Date.now()+400
});
}
animate();
}

function drawBall(b){
ctx.save();
ctx.translate(b.x,b.y);
ctx.rotate(b.rot);
let g=ctx.createRadialGradient(-6,-6,6,0,0,b.r);
g.addColorStop(0,"#555");
g.addColorStop(1,"#000");
ctx.fillStyle=g;
ctx.beginPath();
ctx.arc(0,0,b.r,0,6.28);
ctx.fill();
ctx.strokeStyle="#777";
ctx.lineWidth=4;
ctx.beginPath();
ctx.arc(0,0,b.r*0.75,-Math.PI/2,Math.PI/2);
ctx.stroke();
ctx.restore();
}

function animate(){
ctx.clearRect(0,0,cv.width,cv.height);
let e=Date.now()-startT;
timeFill.style.height=`${100-e/DURATION*100}%`;

if(e>=DURATION&&!answered){handleError();return}

balls.forEach(b=>{
if(Date.now()>b.next){
b.s+=(Math.random()*2-1)*b.v;
b.a+=(Math.random()*2-1)*0.4;
b.next=Date.now()+400;
}
b.x+=Math.cos(b.a)*b.s;
b.y+=Math.sin(b.a)*b.s;
b.rot+=b.s*0.1;

if(b.x<b.r||b.x>cv.width-b.r)b.a=Math.PI-b.a;
if(b.y<b.r||b.y>cv.height-b.r)b.a=-b.a;

drawBall(b);
});
requestAnimationFrame(animate);
}

function createScale(){
bottomBar.innerHTML="";
for(let i=6;i<=18;i++){
let b=document.createElement("button");
b.className="answerBtn";
b.textContent=i;
b.onclick=()=>answer(i);
bottomBar.appendChild(b);
}
}

function answer(v){
if(answered)return;
answered=true;
reactionTimes.push((Date.now()-startT)/1000);

if(v===balls.length){
level++;
if(level>20){finish();} else startLevel();
}else{
handleError();
}
}

function handleError(){
errors++;
cross.style.display="block";
goodAnswer.innerHTML=`Bonne réponse : ${balls.length}`;

setTimeout(()=>{
cross.style.display="none";
goodAnswer.style.display="block";
},600);

if(errors===1){
setTimeout(()=>{
goodAnswer.style.display="none";
startLevel();
},2200);
}else{
setTimeout(()=>finish(),2200);
}
}

function finish(){
document.exitFullscreen();
show("p3");

const avg = reactionTimes.reduce((a,b)=>a+b,0)/reactionTimes.length || 0;
const date = new Date().toLocaleDateString();

const key = nom.value+"_"+prenom.value;
let hist = JSON.parse(localStorage.getItem(key)||"[]");
hist.push(level);
localStorage.setItem(key,JSON.stringify(hist));

const best = Math.max(...hist);
const prev = hist.length>1 ? hist[hist.length-2] : "—";

reportBox.innerHTML = `
<b>Nom :</b> ${nom.value}<br>
<b>Prénom :</b> ${prenom.value}<br>
<b>Date :</b> ${date}<br><br>

<b>Niveau atteint :</b> ${level}<br>
<b>Temps de réaction moyen :</b> ${avg.toFixed(2)} s<br><br>

<b>Meilleure performance :</b> ${best}<br>
<b>Performance précédente :</b> ${prev}
`;
}

function exportPDF(){window.print()}
function restart(){show("p2");level=1;errors=0;reactionTimes=[];startLevel()}
function menu(){location.reload()}
</script>
</body>
</html>
