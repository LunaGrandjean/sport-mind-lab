<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Suivi Visuel Multi-Objets</title>

<style>
html,body{margin:0;height:100%;font-family:Segoe UI,Arial}
body.tracking-active{overflow:hidden}
.page{display:none;height:100%;background:#b22222;color:white}
.page.active{display:flex;flex-direction:column;align-items:center;justify-content:center}

.formBox{
  background:rgba(0,0,0,0.35);
  padding:30px;border-radius:14px;
  display:flex;flex-direction:column;
  gap:22px;min-width:360px
}
.formBox input{font-size:18px;padding:14px;border-radius:8px;border:none}
button{font-size:18px;padding:12px 22px;border-radius:8px;border:none;cursor:pointer}

canvas{position:absolute;top:0;left:0}

/* Jauge temps */
#timeBar{position:absolute;right:0;top:0;width:50px;height:100%;background:#111}
#timeFill{position:absolute;bottom:0;width:100%;
background:linear-gradient(to top,#ff0000,#ffaa00,#00ff00)}

/* Réponses */
#bottomBar{
  position:absolute;bottom:0;width:100%;height:110px;
  background:rgba(0,0,0,0.55);
  display:flex;justify-content:center;align-items:center;gap:10px
}
.answerBtn{
  width:56px;height:56px;border-radius:50%;
  background:#eee;color:#222;font-weight:bold;
  display:flex;align-items:center;justify-content:center;
  font-size:18px
}
#bottomBar.advanced{flex-wrap:wrap;align-content:center;gap:6px;padding:8px}
#bottomBar.advanced .answerBtn{width:44px;height:40px;padding:0;font-size:16px;flex-shrink:0}

/* Feedback */
#cross{font-size:120px;color:#ff4444;display:none}
#goodAnswer{
  display:none;
  background:#0a3;
  padding:18px 30px;
  border-radius:14px;
  font-size:32px;
  font-weight:bold;
  box-shadow:0 0 20px rgba(0,0,0,.4)
}

/* Page 3 */
#reportBox{
  background:rgba(0,0,0,0.35);
  padding:30px;
  border-radius:14px;
  min-width:380px;
  font-size:18px;
  line-height:1.6
}
.page.active.correction-fullscreen{
  align-items:flex-start;
  justify-content:flex-start;
  overflow-y:auto;
  padding:18px 18px 34px;
}
.page.active.correction-fullscreen #reportBox{
  width:min(1440px,100%);
  min-width:0;
  text-align:left;
}
.page.active.correction-fullscreen .snapshot{
  width:min(1280px,100%);
  aspect-ratio: 2.8 / 1;
}
.page.active.correction-fullscreen .snapshot .ball{
  width:60px;
  height:60px;
  font-size:21px;
}
.actions{margin-top:30px;display:flex;flex-direction:column;gap:14px}
label{cursor:pointer}
.correctionPanel{
  margin-top:18px;
  background:rgba(255,255,255,0.12);
  border:1px solid rgba(255,255,255,0.22);
  border-radius:14px;
  padding:18px;
}
.snapshot{
  position:relative;
  width:min(860px,100%);
  aspect-ratio: 2.35 / 1;
  margin:16px auto 12px;
  border-radius:16px;
  background:
    radial-gradient(circle at 50% 50%, rgba(255,255,255,0.08), transparent 60%),
    linear-gradient(180deg, rgba(17,24,39,0.88), rgba(17,24,39,0.96));
  border:1px solid rgba(255,255,255,0.18);
  overflow:hidden;
}
.snapshot .ball{
  position:absolute;
  width:52px;
  height:52px;
  border-radius:50%;
  background:linear-gradient(145deg,#f3f4f6,#9ca3af 70%,#111827);
  border:3px solid rgba(255,255,255,0.62);
  box-shadow:0 6px 16px rgba(0,0,0,0.38);
  color:#111827;
  font-weight:800;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:19px;
  transform:translate(-50%,-50%);
}
.snapshotLabel{
  position:absolute;
  left:14px;
  top:14px;
  font-size:13px;
  font-weight:700;
  color:#fff;
  background:rgba(15,23,42,0.55);
  border:1px solid rgba(255,255,255,0.15);
  padding:7px 12px;
  border-radius:999px;
}
</style>
<link rel="stylesheet" href="./test-theme.css">
</head>

<body>

<!-- PAGE 1 -->
<div class="page active" id="p1">
<h1>Test de suivi visuel</h1>
<div class="formBox">
<input id="nom" type="hidden" value="Session">
<input id="prenom" type="hidden" value="Sportif">
<input id="age" type="hidden" value="0">
<p>Après le niveau 20 : davantage de boules, déplacements plus rapides et vitesses plus variables.</p>
<button onclick="startTest()">Démarrer</button>
</div>
</div>

<!-- PAGE 2 -->
<div class="page" id="p2">
<canvas id="cv"></canvas>
<div id="trackingLevel" style="position:absolute;top:20px;left:20px;color:#061b3c;font-size:24px;font-weight:bold;pointer-events:none"></div>
<div id="timeBar"><div id="timeFill"></div></div>
<div id="bottomBar"></div>
<div id="cross">✖</div>
<div id="goodAnswer"></div>
</div>

<!-- PAGE 3 -->
<div class="page" id="p3">
<h1>Compte rendu</h1>
<div id="reportBox"></div>

<div class="actions">
<label>
<input type="checkbox" id="pdfCheck" onchange="if(this.checked)exportPDF()">
 Export PDF
</label>

<button onclick="toggleCorrectionFullscreen()" id="fullscreenBtn">Correction en plein écran</button>
<button onclick="restart()">Recommencer</button>
<button onclick="menu()">Menu principal</button>
</div>
</div>

<script>
const cv=document.getElementById("cv"),ctx=cv.getContext("2d");
let level=1,errors=0,balls=[],startT,answered=false;
let reactionTimes=[];
let failedSnapshots=[];
let animationFrame=null,feedbackActive=false,feedbackTimers=[];
const DURATION=10000;
const TOP_BARRIER=88;
const BOTTOM_BARRIER=110;
const RIGHT_BARRIER=50;

/* ==== CALIBRATION INITIALE : les niveaux avancés prolongent la difficulté ==== */
const LEVEL_CONFIG = [
{ min:6,max:10,speed:0.45,var:0.00 },
{ min:6,max:10,speed:0.50,var:0.00 },
{ min:7,max:10,speed:0.52,var:0.02 },
{ min:7,max:10,speed:0.55,var:0.04 },
{ min:7,max:10,speed:0.58,var:0.06 },
{ min:7,max:10,speed:0.60,var:0.08 },
{ min:8,max:11,speed:0.60,var:0.10 },
{ min:8,max:11,speed:0.61,var:0.10 },
{ min:8,max:11,speed:0.61,var:0.10 },
{ min:8,max:11,speed:0.62,var:0.11 },
{ min:8,max:11,speed:0.62,var:0.12 },
{ min:8,max:11,speed:0.62,var:0.13 },
{ min:8,max:11,speed:0.63,var:0.14 },
{ min:8,max:12,speed:0.63,var:0.15 },
{ min:9,max:12,speed:0.63,var:0.16 },
{ min:9,max:12,speed:0.63,var:0.17 },
{ min:9,max:13,speed:0.62,var:0.19 },
{ min:10,max:14,speed:0.62,var:0.22 },
{ min:10,max:14,speed:0.63,var:0.26 },
{ min:10,max:14,speed:0.63,var:0.30 }
];

function configForLevel(l){
if(l<=LEVEL_CONFIG.length)return LEVEL_CONFIG[l-1];
const extra=l-LEVEL_CONFIG.length;
return {min:Math.min(24,10+Math.floor(extra/4)),max:Math.min(30,14+Math.floor(extra/4)),speed:Math.min(6,.63*(1+extra*.04)),var:Math.min(.9,.30+extra*.008)};
}

function resize(){
const width=bottomBar.clientWidth||document.documentElement.clientWidth||innerWidth;
const columns=Math.max(1,Math.floor((width-10)/50));
const bottom=level>20?Math.max(BOTTOM_BARRIER,Math.ceil(bottomBar.children.length/columns)*46+16):BOTTOM_BARRIER;
bottomBar.style.height=bottom+"px";
cv.width=Math.max(1,width-RIGHT_BARRIER);cv.height=Math.max(1,innerHeight-bottom);
}
window.onresize=resize;

function show(p){
document.body.classList.toggle("tracking-active",p==="p2");
document.querySelectorAll(".page").forEach(e=>e.classList.remove("active"));
document.getElementById(p).classList.add("active");
}

function toggleCorrectionFullscreen(){
const page=document.getElementById("p3");
const isFullscreenMode=page.classList.toggle("correction-fullscreen");
const btn=document.getElementById("fullscreenBtn");
btn.textContent=isFullscreenMode ? "Quitter le plein écran" : "Correction en plein écran";
if(isFullscreenMode){
document.documentElement.requestFullscreen?.();
document.getElementById("reportBox").scrollIntoView({behavior:"smooth",block:"start"});
}else if(document.fullscreenElement){
document.exitFullscreen?.();
}
}

function startTest(){
document.documentElement.requestFullscreen?.();
resize();
level=1;errors=0;reactionTimes=[];
failedSnapshots=[];
show("p2");
startLevel();
}

function startLevel(){
cancelAnimationFrame(animationFrame);
feedbackTimers.forEach(clearTimeout);
feedbackTimers=[];
feedbackActive=false;
answered=false;
document.getElementById("trackingLevel").textContent=`Niveau ${level}`;
cross.style.display=goodAnswer.style.display="none";
balls=[];
startT=Date.now();
const c=configForLevel(level);
createScale(c);
const n=Math.floor(Math.random()*(c.max-c.min+1))+c.min;

for(let i=0;i<n;i++){
balls.push({
x:Math.random()*cv.width,
y:TOP_BARRIER + Math.random()*(Math.max(1,cv.height-TOP_BARRIER)),
a:Math.random()*6.28,
rot:Math.random()*6.28,
s:c.speed,v:c.var,maxSpeed:c.speed*2,r:26,next:Date.now()+400
});
}
animate();
}

function drawBall(b){
ctx.save();
ctx.translate(b.x,b.y);
ctx.rotate(b.rot);
let g=ctx.createRadialGradient(-6,-6,6,0,0,b.r);
g.addColorStop(0,"#555");
g.addColorStop(1,"#000");
ctx.fillStyle=g;
ctx.beginPath();
ctx.arc(0,0,b.r,0,6.28);
ctx.fill();
ctx.strokeStyle="#777";
ctx.lineWidth=4;
ctx.beginPath();
ctx.arc(0,0,b.r*0.75,-Math.PI/2,Math.PI/2);
ctx.stroke();
ctx.restore();
}

function animate(){
if(answered)return;
ctx.clearRect(0,0,cv.width,cv.height);
let e=Date.now()-startT;
timeFill.style.height=`${100-e/DURATION*100}%`;

if(e>=DURATION&&!answered){handleError();return}

balls.forEach(b=>{
if(Date.now()>b.next){
b.s+=(Math.random()*2-1)*b.v;
if(level>20)b.s=Math.max(.1,Math.min(b.maxSpeed,b.s));
b.a+=(Math.random()*2-1)*0.4;
b.next=Date.now()+400;
}
b.x+=Math.cos(b.a)*b.s;
b.y+=Math.sin(b.a)*b.s;
b.rot+=b.s*0.1;

if(b.x<b.r||b.x>cv.width-b.r)b.a=Math.PI-b.a;
if(b.y<TOP_BARRIER+b.r||b.y>cv.height-b.r)b.a=-b.a;

b.x=Math.max(b.r,Math.min(cv.width-b.r,b.x));
b.y=Math.max(TOP_BARRIER+b.r,Math.min(cv.height-b.r,b.y));

drawBall(b);
});
animationFrame=requestAnimationFrame(animate);
}

function createScale(config=configForLevel(level)){
bottomBar.innerHTML="";
bottomBar.classList.toggle("advanced",level>20);
for(let i=6;i<=Math.max(18,config.max);i++){
let b=document.createElement("button");
b.className="answerBtn";
b.textContent=i;
b.onclick=()=>answer(i);
bottomBar.appendChild(b);
}
resize();
}

function answer(v){
if(answered)return;
answered=true;
cancelAnimationFrame(animationFrame);
reactionTimes.push((Date.now()-startT)/1000);

if(v===balls.length){
level++;
startLevel();
}else{
handleError();
}
}

function handleError(){
if(feedbackActive)return;
feedbackActive=true;
answered=true;
cancelAnimationFrame(animationFrame);
errors++;
failedSnapshots.push({
level,
count: balls.length,
width: cv.width,
height: cv.height,
balls: balls.map((b, index)=>({
index: index + 1,
x: b.x,
y: b.y,
}))
});
cross.style.display="block";
goodAnswer.innerHTML=`Bonne réponse : ${balls.length}`;

feedbackTimers.push(setTimeout(()=>{
cross.style.display="none";
goodAnswer.style.display="block";
},600));

if(errors===1){
feedbackTimers.push(setTimeout(()=>{
goodAnswer.style.display="none";
startLevel();
},2200));
}else{
feedbackTimers.push(setTimeout(()=>finish(),2200));
}
}

function finish(){
answered=true;
cancelAnimationFrame(animationFrame);
feedbackTimers.forEach(clearTimeout);
feedbackTimers=[];
document.exitFullscreen?.();
show("p3");
document.getElementById("p3").classList.remove("correction-fullscreen");
document.getElementById("fullscreenBtn").textContent="Correction en plein écran";

const avg = reactionTimes.reduce((a,b)=>a+b,0)/reactionTimes.length || 0;
const date = new Date().toLocaleDateString();

const key = nom.value+"_"+prenom.value;
let hist = JSON.parse(localStorage.getItem(key)||"[]");
hist.push(level);
localStorage.setItem(key,JSON.stringify(hist));

const best = Math.max(...hist);
const prev = hist.length>1 ? hist[hist.length-2] : "—";
const snapshotHtml = failedSnapshots.length ? `
<div class="correctionPanel">
  <b>Correction du dernier niveau perdu</b>
  ${failedSnapshots.slice(-1).map(snap => `
    <div class="snapshot">
      <div class="snapshotLabel">Niveau ${snap.level} - ${snap.count} boules</div>
      ${snap.balls.map(ball => {
        const left = Math.max(7, Math.min(93, (ball.x / snap.width) * 100));
        const top = Math.max(8, Math.min(92, (ball.y / snap.height) * 100));
        return `<div class="ball" style="left:${left}%;top:${top}%">${ball.index}</div>`;
      }).join("")}
    </div>
  `).join("")}
</div>` : "";

reportBox.innerHTML = `
<b>Nom :</b> ${nom.value}<br>
<b>Prénom :</b> ${prenom.value}<br>
<b>Date :</b> ${date}<br><br>

<b>Niveau atteint :</b> ${level}<br>
<b>Temps de réaction moyen :</b> ${avg.toFixed(2)} s<br><br>

<b>Meilleure performance :</b> ${best}<br>
<b>Performance précédente :</b> ${prev}
${snapshotHtml}
`;
window.SportMindLabResult?.(level, "Niveau atteint");
}

function exportPDF(){window.print()}
function restart(){show("p2");level=1;errors=0;reactionTimes=[];failedSnapshots=[];startLevel()}
function menu(){location.reload()}
</script>
<script>
function hydrateAthleteFromSession(){
const params=new URLSearchParams(window.location.search);
const set=(id,fallback)=>{const field=document.getElementById(id);if(field)field.value=params.get(id)||fallback;};
set("nom","Session");
set("prenom","Sportif");
set("age","0");
}
hydrateAthleteFromSession();
</script>
<script src="./test-shell.js"></script>
</body>
</html>
