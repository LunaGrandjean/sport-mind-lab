<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mémoire en défilements</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#0f172a;color:white;overflow:hidden}
.page{display:none;width:100vw;height:100vh;padding:30px;box-sizing:border-box}
.active{display:block}
.panel{max-width:900px;margin:auto;background:#1e293b;padding:25px;border-radius:20px}
h1,h2{text-align:center}
button,input,select,textarea{padding:12px;border-radius:10px;border:none}
button{cursor:pointer}
#gameZone{position:relative;width:100%;height:100%;overflow:hidden;background:#0b1020}
#levelBadge{position:absolute;top:20px;left:20px;font-size:28px;font-weight:bold;opacity:.18;z-index:20;pointer-events:none}
.ball{
position:absolute;
width:90px;height:90px;border-radius:50%;
display:flex;align-items:center;justify-content:center;
font-weight:bold;font-size:28px;color:#111;
border:4px solid #fff;
box-shadow: inset -10px -10px 20px rgba(0,0,0,.35), inset 8px 8px 15px rgba(255,255,255,.45), 0 10px 20px rgba(0,0,0,.4);
}
.ball .inner{
width:38px;height:38px;border-radius:50%;background:white;
display:flex;align-items:center;justify-content:center;
}
textarea{width:100%;height:100px;font-size:28px;letter-spacing:8px;text-align:center}
.choices{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
</style>
<link rel="stylesheet" href="./test-theme.css">
</head>
<body>

<div id="page1" class="page active">
<div class="panel">
<h1>Mémoire en défilements</h1>
<h2>Paramétrage</h2>
<label>Niveau (1 à 20)<br><input type="number" id="level" min="1" max="20" value="1"></label>
<h3>Distracteurs</h3>
<label><input type="checkbox" id="twoDigits" checked> Boules avec deux numéros</label>
<label><input type="checkbox" id="noDigits" checked> Boules sans numéro</label>
<h3>Sens de défilement</h3>
<select id="direction">
<option>gauche-droite</option>
<option>droite-gauche</option>
<option>alternance-horizontal</option>
<option>haut-bas</option>
<option>bas-haut</option>
<option>alternance-vertical</option>
<option>tous-les-sens</option>
</select>
<div style="text-align:center;margin-top:20px"><button onclick="startSession()">Commencer</button></div>
</div>
</div>

<div id="page2" class="page"><div id="gameZone"><div id="levelBadge"></div></div></div>

<div id="page3" class="page">
<div class="panel">
<h2>Restitution</h2>
<p>Écris les chiffres à la suite, sans espace (exemple : 9642)</p>
<textarea id="answer"></textarea>
<button onclick="validateAnswer()">Valider</button>
</div>
</div>

<div id="page4" class="page">
<div class="panel">
<h2 id="resultText"></h2>
<div class="choices">
<button onclick="restartSameLevel()">Continuer au même niveau</button>
<button onclick="nextLevel()">Poursuivre au niveau supérieur</button>
<button onclick="showSummary()">Arrêt voir les résultats</button>
</div>
</div>
</div>

<div id="page5" class="page">
<div class="panel">
<h2>Résumé</h2>
<div id="summary"></div>
<div style="text-align:center"><button onclick="goHome()">Revenir au menu principal</button></div>
</div>
</div>

<script>
let settings={}, sequence=[], currentLevel=1, successfulLevel=0;
function formatBallNumber(text){
  // Ajoute un petit point sous le 9 pour le distinguer du 6
  if(text === '9') return `<span style="position:relative;display:inline-block;line-height:1;">9<span style="position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);font-size:12px;">•</span></span>`;
  return text;
}

const colors=["#f4c542","#1d4ed8","#dc2626","#7c3aed","#ea580c","#16a34a","#6b7280","#111827","#facc15"];

function showPage(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(id).classList.add('active');}
function getBallCount(level){return Math.min(level,9);}
function getSpeed(level){if(level<=4)return 6000;if(level<=7)return 4000;if(level<=9)return 3000;if(level<=12)return 2000;if(level<=15)return 1000;if(level===16)return 800;if(level===17)return 600;if(level===18)return 400;if(level===19)return 200;return 80;}

function startSession(){
currentLevel=parseInt(document.getElementById('level').value);
settings={direction:direction.value,twoDigits:twoDigits.checked,noDigits:noDigits.checked};
launchGame();
}

async function enterFullscreen(){
const el=document.documentElement;
if(!document.fullscreenElement){try{await el.requestFullscreen();}catch(e){}}
}

function randomDirection(){return ['gauche-droite','droite-gauche','haut-bas','bas-haut'][Math.floor(Math.random()*4)]}
function resolveDirection(i){
if(settings.direction==='alternance-horizontal') return i%2===0?'gauche-droite':'droite-gauche';
if(settings.direction==='alternance-vertical') return i%2===0?'haut-bas':'bas-haut';
if(settings.direction==='tous-les-sens') return randomDirection();
return settings.direction;
}

async function launchGame(){
await enterFullscreen();
showPage('page2');
document.getElementById('levelBadge').innerText = 'Niveau ' + currentLevel;
let zone=gameZone;
let countdown=5;
zone.innerHTML=`<div id='levelBadge'>Niveau ${currentLevel}</div><h1 style='margin-top:40vh;text-align:center'>Début dans ${countdown}...</h1>`;
const timer=setInterval(()=>{
countdown--;
zone.innerHTML=`<div id='levelBadge'>Niveau ${currentLevel}</div><h1 style='margin-top:40vh;text-align:center'>Début dans ${countdown}...</h1>`;
if(countdown===0){clearInterval(timer);runBalls();}
},1000);
}

function runBalls(){
gameZone.innerHTML=`<div id='levelBadge'>Niveau ${currentLevel}</div>`;
sequence=[];
let speed=getSpeed(currentLevel);
let balls=[];

for(let i=0;i<getBallCount(currentLevel);i++){
balls.push({type:'single',text:String(Math.floor(Math.random()*9)+1)});
}
if(settings.twoDigits){for(let i=0;i<2;i++) balls.push({type:'double',text:String(Math.floor(Math.random()*90)+10)});}
if(settings.noDigits){for(let i=0;i<2;i++) balls.push({type:'none',text:''});}

balls.sort(()=>Math.random()-0.5);

// RÈGLE CORRIGÉE : on mémorise uniquement les boules à 1 chiffre dans l'ordre réel d'apparition
balls.forEach(b=>{if(b.type==='single') sequence.push(b.text);});

let completed=0;
balls.forEach((b,i)=>{
setTimeout(()=>{
animateBall(b.text, resolveDirection(i), speed, ()=>{
completed++;
if(completed===balls.length){setTimeout(()=>showPage('page3'),500);}
});
}, i*450);
});
}

function animateBall(text,direction,duration,callback){
const ball=document.createElement('div');
ball.className='ball';
ball.style.background=`radial-gradient(circle at 30% 30%, white, ${colors[Math.floor(Math.random()*colors.length)]} 70%)`;
ball.innerHTML = text ? `<div class='inner'>${formatBallNumber(text)}</div>` : '';

gameZone.appendChild(ball);

const w=window.innerWidth, h=window.innerHeight;
let startX,startY,endX,endY;
if(direction==='gauche-droite'){startX=-120;endX=w+120;startY=endY=60+Math.random()*(h-220)}
if(direction==='droite-gauche'){startX=w+120;endX=-120;startY=endY=60+Math.random()*(h-220)}
if(direction==='haut-bas'){startY=-120;endY=h+120;startX=endX=60+Math.random()*(w-220)}
if(direction==='bas-haut'){startY=h+120;endY=-120;startX=endX=60+Math.random()*(w-220)}

const curve=(Math.random()*80)-40;
const rotationMax=120 + Math.random()*180;
const start=performance.now();

function ease(t){return t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2;}

function move(now){
let t=Math.min((now-start)/duration,1);
let p=ease(t);
let x=startX+(endX-startX)*p;
let y=startY+(endY-startY)*p;

// léger mouvement réaliste (micro-déviation)
if(startY===endY) y += Math.sin(t*Math.PI)*curve;
if(startX===endX) x += Math.sin(t*Math.PI)*curve;

ball.style.transform=`translate(${x}px,${y}px) rotate(${rotationMax*p}deg)`;

if(t<1) requestAnimationFrame(move);
else {ball.remove();callback();}
}
requestAnimationFrame(move);
}

function validateAnswer(){
// sans séparateur : ex 96
const userAnswer=answer.value.trim().split('');
const correct=JSON.stringify(userAnswer)===JSON.stringify(sequence);
if(correct) successfulLevel=currentLevel;
resultText.innerText = correct ? 'Bonne réponse ✅' : `Mauvaise réponse ❌ | Bonne réponse : ${sequence.join('')}`;
answer.value='';
showPage('page4');
}

function restartSameLevel(){launchGame();}
function nextLevel(){if(currentLevel<20) currentLevel++; launchGame();}
function showSummary(){
summary.innerHTML=`<p><strong>Sens :</strong> ${settings.direction}</p><p><strong>Distracteurs :</strong> ${settings.twoDigits?'2 chiffres ':''}${settings.noDigits?'sans numéro':''}</p><p><strong>Niveau réussi :</strong> ${successfulLevel}</p>`;
showPage('page5');
}
function goHome(){showPage('page1');}
</script>
<script src="./test-shell.js"></script>
</body>
</html>
